name: Download count badge

# The README's downloads badge. GitHub only counts downloads of assets that still exist, so the
# stock shields.io "github/downloads" badge drops every time prune-releases.yml strips an old
# release. Instead, the orphan branch `stats` keeps:
#   archived.json   {"archived": N}  downloads of every asset prune-releases.yml deleted (it adds to it)
#   downloads.json  a shields.io endpoint badge: archived + downloads of the assets still published
# This job rewrites downloads.json. README badge:
#   https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/roe69/roesnip/stats/downloads.json
# Runs hourly, after every prune, and on dispatch. Never checks anything out: GitHub API calls only.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: download-badge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  badge:
    name: Update the downloads badge
    runs-on: [self-hosted, linux-release-roesnip]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == 'roe69' && github.triggering_actor == 'roe69'))
    permissions:
      contents: write
    steps:
      - name: Write archived + live downloads to the stats branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="repos/$REPO/contents"

          archived=$(gh api "$api/archived.json?ref=stats" --jq '.content | gsub("\n"; "") | @base64d | fromjson | .archived')
          case "$archived" in ''|*[!0-9]*) echo "::error::archived.json holds '$archived', not a count."; exit 1 ;; esac

          # --paginate prints one sum per page.
          live=$(gh api "repos/$REPO/releases?per_page=100" --paginate --jq '[.[].assets[].download_count] | add // 0' \
            | awk '{ s += $1 } END { print s + 0 }')
          total=$((archived + live))
          if [ "$total" -ge 1000000 ]; then msg=$(awk -v n="$total" 'BEGIN { printf "%.1fM", n / 1000000 }')
          elif [ "$total" -ge 1000 ]; then msg=$(awk -v n="$total" 'BEGIN { printf "%.1fk", n / 1000 }')
          else msg="$total"; fi
          echo "archived $archived + live $live = $total ($msg)"

          json='{"schemaVersion":1,"label":"total downloads","message":"'"$msg"'","color":"FF6B35","namedLogo":"github"}'
          cur=$(gh api "$api/downloads.json?ref=stats" --jq '(.sha) + " " + (.content | gsub("\n"; "") | @base64d)')
          sha="${cur%% *}"
          if [ "${cur#* }" = "$json" ]; then echo "Badge already says $msg."; exit 0; fi
          gh api -X PUT "$api/downloads.json" -f branch=stats -f sha="$sha" \
            -f message="- stats: $total downloads" -f content="$(printf '%s' "$json" | base64 -w0)" --jq '.commit.sha'
          echo "Downloads badge: $msg ($total)" >> "$GITHUB_STEP_SUMMARY"
