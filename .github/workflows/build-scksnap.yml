name: build-scksnap

# Builds RoeSnip's macOS capture helper (helpers/scksnap) on a macOS runner - it cannot be built
# on the Windows dev machine.
# Artifact: scksnap.tar.gz containing the universal, ad-hoc-signed 'scksnap' binary.

on:
  push:
    paths:
      - "helpers/scksnap/**"
      - ".github/workflows/build-scksnap.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: Build scksnap (macOS universal)
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain versions (for the build log)
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version

      - name: Build universal binary
        working-directory: helpers/scksnap
        # Info.plist is embedded (__TEXT,__info_plist) for NSMicrophoneUsageDescription.
        run: |
          for arch in arm64 x86_64; do
            swiftc -parse-as-library -O \
              -target ${arch}-apple-macos13.0 \
              -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker Info.plist \
              -o scksnap-${arch} Sources/*.swift
          done
          lipo -create -output scksnap scksnap-arm64 scksnap-x86_64
          lipo -info scksnap

      - name: Ad-hoc sign with stable identifier (TCC attribution)
        working-directory: helpers/scksnap
        run: |
          codesign --force --sign - --identifier net.roelite.roesnip.scksnap scksnap
          codesign --display --verbose=2 scksnap

      - name: Smoke test (list verb - CoreGraphics enumeration, no TCC needed)
        working-directory: helpers/scksnap
        run: ./scksnap list

      - name: Smoke test (serve mode answers a ping, exits on stdin EOF)
        working-directory: helpers/scksnap
        run: |
          out=$( (printf '\x05\x00\x00\x00\x09\x01\x00\x00\x00'; sleep 2) | ./scksnap serve | od -An -tx1 | tr -d ' \n')
          echo "reply: $out"
          test "$out" = "09000000010000000001000000"

      - name: Package (tar preserves the executable bit and signature)
        working-directory: helpers/scksnap
        run: tar -czf scksnap.tar.gz scksnap

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scksnap
          path: helpers/scksnap/scksnap.tar.gz
          if-no-files-found: error
