name: release

# ONE action: version check -> build (win-x64 + win-arm64 / linux-x64 + linux-arm64 / osx-arm64 + osx-x64)
# -> publish a single GitHub Release. Modelled on installer-src's build-all.yml shape (a
# preflight/version job -> parallel per-platform builds -> one all-or-nothing publish job), collapsed
# into a single workflow so cutting a release is a single dispatch. TWO in-app self-updaters poll
# GET /repos/roe69/roesnip/releases/latest and each downloads its OWN exact asset name - the WPF
# app's App/UpdateManager.cs downloads "RoeSnip.exe"; the Avalonia port's AppShell/UpdateManager.cs
# downloads, per OS and process arch (RoeSnip.Core/Updates/UpdateAssetNames.cs):
#   Windows  RoeSnipApp-win-<x64|arm64>.exe (+ .gz)
#   Linux    RoeSnip-linux-<x64|arm64>.AppImage      (only when running from an AppImage)
#   macOS    RoeSnip-osx-<arm64|x64>.app.tar.gz      (tar of RoeSnip.app, keeps exec bits + xattrs)
# Every asset name is load-bearing and must never change or collide (a name collision would let one
# app's updater silently download and swap in the OTHER product's binary). The .dmg and
# RoeSnip-linux-<arch>.tar.gz (publish folder, for distros without FUSE) are for manual installs.
#
# WINDOWS SIGNING (same model as installer-src, hardened for a public repo): build-windows runs repo
# code and NuGet restore, so it runs on GitHub-hosted windows-latest with no OIDC token. Only
# sign-windows runs on our persistent win-build runner (this repo's runner only): it checks out
# nothing, runs no repo code, fetches a pinned Temurin JRE + jsign + kmsp11 (sha256) into a fresh
# temp dir, checks each exe against the sha256 the build job published as a job output, and signs
# exactly RoeSnip.exe, RoeSnipApp-win-x64.exe and RoeSnipApp-win-arm64.exe with the Cloud KMS key
# RoeLite-27 through GCP workload identity provider `roesnip` (repo + repo id, refs/heads/main,
# this workflow file, actor roe69 + actor id). Both jobs carry a job-level `if` (main,
# workflow_dispatch, actor roe69). The release job (ubuntu, contents: write, gh CLI only) makes
# each "<name>.exe.gz" from the SIGNED bytes and publishes. Self-updaters trust the GitHub asset
# digest. Every action is pinned by full commit SHA (tag in the trailing comment).
# Both UpdateManagers prefer the "<name>.exe.gz" sibling and fall back to the plain exe. Never
# remove or rename the plain "RoeSnip.exe" / "RoeSnipApp-win-x64.exe" assets: older installs only
# ever look for those exact names.
#
# LOOP SAFETY (why this cannot re-trigger itself):
#   * There is NO `push` trigger at all (no branches, no tags): the release tag created at publish
#     starts no run. A release is only ever started by workflow_dispatch from main (prep refuses
#     other refs).
#   * prep pushes nothing: the version bump is committed to main by a person before dispatch.
#   * concurrency serialises runs so two releases can't race.
#   NEVER replace GITHUB_TOKEN with a PAT/App token in checkout or gh release - every guard
#   above assumes GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version e.g. 1.0.2"
        required: true

# Default to read; only release (creates the release) gets write.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve the version and check both csprojs already carry it (no commit is
  #    pushed). Outputs the dispatch commit SHA so every build leg + the release
  #    tag point at the same commit.
  # ---------------------------------------------------------------------------
  prep:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # A release is built from exactly the dispatch commit on main.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch this workflow from main."; exit 1
          fi
          VERSION="${INPUT_VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not in x.y.z form"; exit 1
          fi
          TAG="v$VERSION"

          # Refuse to clobber an already-PUBLISHED release (a leftover draft is fine to reuse).
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q '^false$'; then
            echo "::error::A published release $TAG already exists - refusing to overwrite."; exit 1
          fi
          # Deleting a release does NOT delete its tag; a stale tag would make the release step
          # attach new binaries to a tag pointing at the OLD commit.
          git fetch --tags --quiet || true
          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "::error::Tag $TAG already exists (stale from an earlier run?). Delete it or pick a new version."; exit 1
          fi

          # No bump commit is pushed (main is protected): commit the version of both apps to main
          # first, then dispatch. Each app's UpdateManager.cs compares its own <Version> to the
          # release tag, so both must match.
          for f in src/RoeSnip/RoeSnip.csproj src/RoeSnip.App/RoeSnip.App.csproj; do
            [ "$(grep -oE '<Version>[^<]*</Version>' "$f" | sed -E 's#</?Version>##g')" = "$VERSION" ] || {
              echo "::error::$f <Version> is not $VERSION - commit the bump to main first, then dispatch."; exit 1
            }
          done

          SHA="$(git rev-parse HEAD)"
          [ "$SHA" = "$GITHUB_SHA" ] || { echo "::error::checkout is not the dispatch commit"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2a. Windows: the WPF app -> single-file self-contained RoeSnip.exe (the exact
  #     asset the self-updater downloads). Also build + test the whole solution
  #     here - the only host that can compile the WPF XAML (PresentationBuildTasks
  #     is Windows-only) - so a broken release fails before anything is published.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (win-x64)
    needs: prep
    runs-on: windows-latest
    # GitHub-hosted: this job runs repo code and NuGet restore, so it never touches the win-build VM.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'roe69' && github.triggering_actor == 'roe69'
    # Read-only, no OIDC token (signing is the sign-windows job).
    permissions:
      contents: read
    outputs:
      sha_win: ${{ steps.hash.outputs.sha_win }}
      sha_app_x64: ${{ steps.hash.outputs.sha_app_x64 }}
      sha_app_arm64: ${{ steps.hash.outputs.sha_app_arm64 }}
    steps:
      - name: Check out (dispatch commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prep.outputs.sha }}
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Build solution (Release)
        run: dotnet build RoeSnip.sln -c Release

      - name: Test
        run: dotnet test RoeSnip.sln -c Release --no-build

      # win-x64.pubxml pins RuntimeIdentifier/SelfContained/PublishSingleFile (ReadyToRun and
      # single-file compression are deliberately OFF - see the pubxml's comments before changing).
      # Output: src/RoeSnip/bin/Release/net8.0-windows10.0.22621.0/win-x64/publish/RoeSnip.exe.
      - name: Publish WPF app (win-x64)
        run: dotnet publish src/RoeSnip/RoeSnip.csproj -c Release -p:PublishProfile=win-x64 -p:Version=${{ needs.prep.outputs.version }}

      - name: Upload RoeSnip.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win
          path: src/RoeSnip/bin/Release/net8.0-windows10.0.22621.0/win-x64/publish/RoeSnip.exe
          if-no-files-found: error

      # RoeSnip.App (the Avalonia cross-platform port) ships its own distinctly-named Windows asset
      # so its self-updater (AppShell/UpdateManager.cs) can never collide with the WPF app's own
      # "RoeSnip.exe" asset above - see that file's doc comment. win-x64.pubxml pins the same
      # SelfContained/PublishSingleFile/ReadyToRun-off shape as the WPF app's own profile; -f/-r are
      # passed explicitly because a multi-targeted project (net8.0 + this windows TFM) can't resolve
      # which one to publish from the pubxml's own TargetFramework alone (NETSDK1129).
      - name: Publish RoeSnip.App (win-x64)
        run: dotnet publish src/RoeSnip.App/RoeSnip.App.csproj -c Release -f net8.0-windows10.0.22621.0 -r win-x64 -p:PublishProfile=win-x64 -p:Version=${{ needs.prep.outputs.version }}

      - name: Rename RoeSnip.App Windows asset
        run: mv src/RoeSnip.App/bin/Release/net8.0-windows10.0.22621.0/win-x64/publish/RoeSnip.exe src/RoeSnip.App/bin/Release/net8.0-windows10.0.22621.0/win-x64/publish/RoeSnipApp-win-x64.exe

      - name: Upload RoeSnip.App Windows asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-app
          path: src/RoeSnip.App/bin/Release/net8.0-windows10.0.22621.0/win-x64/publish/RoeSnipApp-win-x64.exe
          if-no-files-found: error

      # RoeSnip.App for Windows on ARM: cross-published on the x64 runner (pure managed + system
      # D3D/MF DLLs; SharpHook/SkiaSharp/HarfBuzz ship win-arm64 natives). Same single-file shape.
      - name: Publish RoeSnip.App (win-arm64)
        run: dotnet publish src/RoeSnip.App/RoeSnip.App.csproj -c Release -f net8.0-windows10.0.22621.0 -r win-arm64 -p:PublishProfile=win-arm64 -p:Version=${{ needs.prep.outputs.version }}

      - name: Rename RoeSnip.App win-arm64 asset
        shell: pwsh
        run: |
          $out = 'src/RoeSnip.App/bin/Release/net8.0-windows10.0.22621.0/win-arm64/publish'
          Move-Item "$out/RoeSnip.exe" "$out/RoeSnipApp-win-arm64.exe"

      - name: Upload RoeSnip.App win-arm64 asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-app-arm64
          path: src/RoeSnip.App/bin/Release/net8.0-windows10.0.22621.0/win-arm64/publish/RoeSnipApp-win-arm64.exe
          if-no-files-found: error

      # sign-windows compares what it downloads with these (job outputs travel outside the artifacts).
      - name: Record sha256 of the three exes
        id: hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $b = 'src/RoeSnip.App/bin/Release/net8.0-windows10.0.22621.0'
          $map = [ordered]@{
            sha_win       = 'src/RoeSnip/bin/Release/net8.0-windows10.0.22621.0/win-x64/publish/RoeSnip.exe'
            sha_app_x64   = "$b/win-x64/publish/RoeSnipApp-win-x64.exe"
            sha_app_arm64 = "$b/win-arm64/publish/RoeSnipApp-win-arm64.exe"
          }
          foreach ($k in $map.Keys) {
            $h = (Get-FileHash $map[$k] -Algorithm SHA256).Hash.ToLowerInvariant()
            "$k=$h" | Add-Content $env:GITHUB_OUTPUT
            "$h  $($map[$k])"
          }

  # ---------------------------------------------------------------------------
  # 2b. Cross-platform (RoeSnip.App, net8.0): one matrix leg per shippable arch;
  #     the steps branch on runner.os. Linux: .AppImage (self-updates) + .tar.gz of
  #     the publish folder. macOS: unsigned .dmg + RoeSnip-osx-<arch>.app.tar.gz
  #     (the self-update asset). osx-x64 is cross-published on the arm64 runner
  #     (dotnet publish -r osx-x64 + swiftc -target x86_64) so it never depends on an
  #     Intel macOS runner image. linux-arm64 builds natively on ubuntu-24.04-arm.
  #     .rpm / .deb packages are deliberately not built.
  # ---------------------------------------------------------------------------
  build-xplat:
    name: Build ${{ matrix.rid }}
    needs: prep
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            appimage_arch: x86_64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64
          - rid: osx-arm64
            runner: macos-15
            swift_target: arm64-apple-macos13.0
          - rid: osx-x64
            runner: macos-15
            swift_target: x86_64-apple-macos13.0
    steps:
      - name: Check out (dispatch commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prep.outputs.sha }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      # -f net8.0 builds only the cross-platform TFM, but the implicit restore still evaluates the
      # project's net8.0-windows* TFM, which trips NETSDK1100 on Linux/macOS ("set EnableWindowsTargeting
      # to true"). Setting that property lets restore resolve the windows TFM's ref packs without a
      # Windows host; the actual publish stays net8.0 + the target RID (Platform.Windows is not
      # referenced for a non-win RID). AssemblyName is RoeSnip, so the published binary is <publish>/RoeSnip.
      # Item 17: same PublishReadyToRun/EnableCompressionInSingleFile/SatelliteResourceLanguages
      # trio as the win-x64.pubxml (see that file's comments) - this leg has no pubxml of its own
      # (the RID is matrix-driven), so the properties are passed directly. Compression only bites
      # once PublishSingleFile is on (not set on this folder-publish leg today), but keeping the
      # property here means flipping single-file on later doesn't silently reintroduce the idle-RAM
      # regression the win-x64 build already fixed.
      - name: Publish RoeSnip.App (${{ matrix.rid }})
        run: dotnet publish src/RoeSnip.App -c Release -f net8.0 -r ${{ matrix.rid }} --self-contained -p:EnableWindowsTargeting=true -p:PublishReadyToRun=false -p:EnableCompressionInSingleFile=false -p:SatelliteResourceLanguages=en -p:Version=${{ needs.prep.outputs.version }}


      # JxrEncApp (jxrlib, BSD-2-Clause) writes the HDR original as .jxr on Linux and macOS; it ships
      # as a flat sibling of the RoeSnip executable (JxrExport.LocateEncoder), next to its licence.
      # osx-x64 is cross-compiled on the arm64 runner.
      - name: Build JxrEncApp (${{ matrix.rid }})
        shell: bash
        run: |
          set -euo pipefail
          ARCH_FLAGS=""
          if [ "${{ matrix.rid }}" = "osx-x64" ]; then ARCH_FLAGS="-arch x86_64"; fi
          sh helpers/jxrenc/build.sh "$PWD/jxrenc-out" "$ARCH_FLAGS"
          # Linux and the matching-arch mac build can run it: a lossless 128bppRGBAFloat encode of a 2x2 float TIFF.
          if [ "${{ matrix.rid }}" != "osx-x64" ]; then
            python3 - <<'PY'
          import struct
          w = h = 2
          data = struct.pack("<16f", *([3.0, 1.0, 0.25, 1.0] * 4))
          n = 12
          bps = 8 + 2 + n * 12 + 4
          entries = [(256, 4, 1, w), (257, 4, 1, h), (258, 3, 4, bps), (259, 3, 1, 1), (262, 3, 1, 2),
                     (273, 4, 1, bps + 8), (277, 3, 1, 4), (278, 4, 1, h), (279, 4, 1, len(data)),
                     (284, 3, 1, 1), (338, 3, 1, 2), (339, 3, 1, 3)]
          out = b"II*\x00" + struct.pack("<IH", 8, n)
          for tag, typ, cnt, val in entries:
              out += struct.pack("<HHII", tag, typ, cnt, val)
          out += struct.pack("<I", 0) + struct.pack("<4H", 32, 32, 32, 32) + data
          open("jxr-probe.tif", "wb").write(out)
          PY
            "$PWD/jxrenc-out/JxrEncApp" -i jxr-probe.tif -o jxr-probe.jxr -c 28 -q 1.0
            test -s jxr-probe.jxr
          fi

      # ---- Linux: AppImage via the official static appimagetool, plus a tar.gz --------------
      # appimagetool must match the runner arch (aarch64 on ubuntu-24.04-arm); it embeds the
      # runtime for ARCH. roesnip.png sits at the AppDir root: the app copies it from $APPDIR into
      # the user's icon theme on install (AppShell/LinuxDesktopIntegration.cs).
      - name: Package .AppImage and .tar.gz
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # ImageMagick is not preinstalled on ubuntu-24.04 - install it for the .ico -> .png icon.
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends imagemagick
          VERSION="${{ needs.prep.outputs.version }}"
          PUBLISH="src/RoeSnip.App/bin/Release/net8.0/${{ matrix.rid }}/publish"
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"; mkdir -p "$APPDIR/usr/bin"
          cp -a "$PUBLISH/." "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/RoeSnip"
          cp jxrenc-out/JxrEncApp jxrenc-out/JXRLIB-LICENSE.txt "$APPDIR/usr/bin/"
          convert "src/RoeSnip/Assets/roesnip.ico[0]" -resize 256x256 "$APPDIR/roesnip.png"
          cat > "$APPDIR/net.roelite.roesnip.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=RoeSnip
          Exec=RoeSnip
          Icon=roesnip
          Categories=Graphics;Utility;
          Terminal=false
          X-AppImage-Version=${VERSION}
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/RoeSnip" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          # --appimage-extract-and-run avoids needing FUSE on the runner.
          # Pinned release 1.9.1 + sha256. The release publishes no checksum file; these are GitHub's
          # asset digests (releases API), and a download of both assets hashed to the same values.
          case "${{ matrix.appimage_arch }}" in
            x86_64)  AIT_SHA=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 ;;
            aarch64) AIT_SHA=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158 ;;
            *) echo "::error::no pinned appimagetool for ${{ matrix.appimage_arch }}"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.appimage_arch }}.AppImage" -o appimagetool
          echo "$AIT_SHA  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          mkdir -p dist
          ARCH=${{ matrix.appimage_arch }} VERSION="$VERSION" ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/RoeSnip-${{ matrix.rid }}.AppImage"
          # Publish folder as a tarball for distros without FUSE (passive update notice only).
          rm -rf tarroot; mkdir -p tarroot/RoeSnip
          cp -a "$PUBLISH/." tarroot/RoeSnip/
          cp "$APPDIR/roesnip.png" tarroot/RoeSnip/roesnip.png
          cp jxrenc-out/JxrEncApp jxrenc-out/JXRLIB-LICENSE.txt tarroot/RoeSnip/
          tar -C tarroot -czf "dist/RoeSnip-${{ matrix.rid }}.tar.gz" RoeSnip

      # ---- macOS: build the capture helper, wrap in a .app, produce an UNSIGNED .dmg ----------
      # No Developer ID / notarization secrets exist, so the .app is only ad-hoc signed and the .dmg
      # is unsigned - Gatekeeper will warn; testers right-click > Open once. The ad-hoc signature
      # changes every build, so macOS may ask for Screen Recording permission again after an update.
      - name: Build scksnap capture helper
        if: runner.os == 'macOS'
        working-directory: helpers/scksnap
        run: |
          set -euo pipefail
          swiftc -parse-as-library -O -target ${{ matrix.swift_target }} \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker Info.plist \
            -o scksnap Sources/*.swift
          codesign --force --sign - --identifier net.roelite.roesnip.scksnap scksnap

      - name: Package unsigned .dmg and .app.tar.gz
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          PUBLISH="src/RoeSnip.App/bin/Release/net8.0/${{ matrix.rid }}/publish"
          APP="RoeSnip.app"
          rm -rf "$APP" dmgroot; mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -a "$PUBLISH/." "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/RoeSnip"
          # scksnap ships as a flat sibling of the RoeSnip executable (ROESNIP_SCKSNAP_PATH default).
          cp helpers/scksnap/scksnap "$APP/Contents/MacOS/scksnap"
          cp jxrenc-out/JxrEncApp jxrenc-out/JXRLIB-LICENSE.txt "$APP/Contents/MacOS/"
          # Icon (cosmetic - never fail the build on it).
          mkdir -p RoeSnip.iconset
          sips -s format png "src/RoeSnip/Assets/roesnip.ico" --out RoeSnip.iconset/icon_256x256.png >/dev/null 2>&1 || true
          iconutil -c icns RoeSnip.iconset -o "$APP/Contents/Resources/RoeSnip.icns" >/dev/null 2>&1 || true
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>RoeSnip</string>
            <key>CFBundleDisplayName</key><string>RoeSnip</string>
            <key>CFBundleExecutable</key><string>RoeSnip</string>
            <key>CFBundleIdentifier</key><string>net.roelite.roesnip</string>
            <key>CFBundleVersion</key><string>__VERSION__</string>
            <key>CFBundleShortVersionString</key><string>__VERSION__</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>RoeSnip</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSMicrophoneUsageDescription</key><string>RoeSnip records your microphone into screen recordings when you turn it on.</string>
          </dict>
          </plist>
          EOF
          sed -i '' "s#__VERSION__#${{ needs.prep.outputs.version }}#g" "$APP/Contents/Info.plist"
          grep -q "<string>${{ needs.prep.outputs.version }}</string>" "$APP/Contents/Info.plist"
          # Ad-hoc sign (no secrets); unsigned/un-notarized on purpose.
          codesign --force --deep --sign - "$APP" || true
          mkdir -p dmgroot dist
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "RoeSnip" -srcfolder dmgroot -ov -format UDZO "dist/RoeSnip-${{ matrix.rid }}.dmg"
          # Self-update asset: bsdtar keeps exec bits and the xattrs codesign stores on non-Mach-O
          # files; the app extracts it with /usr/bin/tar next to ~/Applications/RoeSnip.app.
          tar -czf "dist/RoeSnip-${{ matrix.rid }}.app.tar.gz" "$APP"
          tar -tzf "dist/RoeSnip-${{ matrix.rid }}.app.tar.gz" | grep -qx "RoeSnip.app/Contents/MacOS/RoeSnip"

      - name: Upload ${{ matrix.rid }} artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xplat-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
  # ---------------------------------------------------------------------------
  # 2c. Sign the three RoeSnip exes (EV key RoeLite-27 in Cloud KMS, reached keylessly through
  #     workload identity federation, exactly as installer-src does). Runs on our persistent
  #     win-build runner and is the ONLY job with id-token: write, so it executes nothing from
  #     this repo and shares nothing with the runner's earlier jobs: no checkout, no tool cache,
  #     no profile script (shell below), a fresh per-run tools dir deleted first, every tool by
  #     absolute path. The GCP provider `roesnip` accepts only this repo + id, refs/heads/main,
  #     this workflow file and actor roe69 + id. Never a third-party binary: only these names.
  # ---------------------------------------------------------------------------
  sign-windows:
    name: Sign Windows exes
    needs: [prep, build-windows]
    runs-on: [self-hosted, win-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'roe69' && github.triggering_actor == 'roe69'
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
    steps:
      - name: Download unsigned Windows exes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: win*
          path: winin

      # Java x64 (kmsp11 is amd64 only), jsign, kmsp11 and the certificate chain: all sha256
      # pinned, all into a directory deleted first. The chain comes from the dispatch commit
      # over HTTPS (public repo, no token) and is hash-checked, so nothing here needs a checkout.
      - name: Fetch signing tools
        env:
          SHA: ${{ needs.prep.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dir = Join-Path $env:RUNNER_TEMP "codesign-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          "TOOLS=$dir" | Add-Content $env:GITHUB_ENV
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          New-Item -ItemType Directory -Force $dir | Out-Null
          $tools = @(
            @{ url = 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13.1%2B2/OpenJDK21U-jre_x64_windows_hotspot_21.0.13.1_2.zip'; file = 'jre.zip'; sha = 'E15EE1E54A5A3B38027A09CEDFA87BC3348D7DD3CE50866DD3D9671D7FFFC6C1' },
            @{ url = 'https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar'; file = 'jsign.jar'; sha = '6CF58AA080E7FF82656F320CFF8D4A3BFF30408DF8766806DCBA3740DD839FA5' },
            @{ url = 'https://github.com/GoogleCloudPlatform/kms-integrations/releases/download/pkcs11-v1.9/libkmsp11-1.9-windows-amd64.zip'; file = 'kmsp11.zip'; sha = '2592C65FA78B07F4F112FA137FCCE1F5497BC47907FFCED51AB5AD0F9E3904A0' },
            @{ url = "https://raw.githubusercontent.com/roe69/roesnip/$($env:SHA)/.github/codesign/roelite-27-chain.pem"; file = 'chain.pem'; sha = '00EC41EAC09DE16BBD7BD0B3DCF52375803492E7C02F01AAF905C19D7DC410C6' }
          )
          foreach ($t in $tools) {
            $out = Join-Path $dir $t.file
            Invoke-WebRequest $t.url -OutFile $out
            if ((Get-FileHash $out -Algorithm SHA256).Hash -ne $t.sha) { throw "checksum mismatch: $($t.url)" }
          }
          Expand-Archive (Join-Path $dir 'jre.zip') -DestinationPath (Join-Path $dir 'jre') -Force
          Expand-Archive (Join-Path $dir 'kmsp11.zip') -DestinationPath (Join-Path $dir 'kmsp11') -Force
          $java = @(Get-ChildItem (Join-Path $dir 'jre') -Recurse -File -Filter java.exe)
          if ($java.Count -ne 1) { throw "expected one java.exe, found $($java.Count)" }
          $dll = @(Get-ChildItem (Join-Path $dir 'kmsp11') -Recurse -File -Filter kmsp11.dll)
          if ($dll.Count -ne 1) { throw "expected one kmsp11.dll, found $($dll.Count)" }
          "name = kmsp11`nlibrary = $($dll[0].FullName -replace '\\', '/')`nslotListIndex = 0`n" | Set-Content -Encoding ascii (Join-Path $dir 'pkcs11.cfg')
          "generate_certs: true`ntokens:`n  - key_ring: `"projects/roelite-codesign/locations/australia-southeast2/keyRings/codesign-keyring`"`n" | Set-Content -Encoding ascii (Join-Path $dir 'kms.yaml')
          "JAVA_EXE=$($java[0].FullName)" | Add-Content $env:GITHUB_ENV
          "KMS_PKCS11_CONFIG=$(Join-Path $dir 'kms.yaml')" | Add-Content $env:GITHUB_ENV

      # Last step before signing so the credentials file lives as briefly as possible.
      - name: Authenticate to Google Cloud (code signing)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/327472973067/locations/global/workloadIdentityPools/github/providers/roesnip

      # Each exe is copied, then hashed AFTER the copy against the build job's output, then signed.
      # --replace: jsign would otherwise nest a new signature under an existing one.
      - name: Sign RoeSnip.exe, RoeSnipApp-win-x64.exe, RoeSnipApp-win-arm64.exe
        env:
          SHA_WIN: ${{ needs.build-windows.outputs.sha_win }}
          SHA_APP_X64: ${{ needs.build-windows.outputs.sha_app_x64 }}
          SHA_APP_ARM64: ${{ needs.build-windows.outputs.sha_app_arm64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = $env:TOOLS
          $expect = @{
            'RoeSnip.exe'              = $env:SHA_WIN
            'RoeSnipApp-win-x64.exe'   = $env:SHA_APP_X64
            'RoeSnipApp-win-arm64.exe' = $env:SHA_APP_ARM64
          }
          New-Item -ItemType Directory -Force signed | Out-Null
          foreach ($n in $expect.Keys) {
            if ($expect[$n] -notmatch '^[0-9a-f]{64}$') { throw "no build sha256 for $n" }
            $found = @(Get-ChildItem winin -Recurse -File -Filter $n)
            if ($found.Count -ne 1) { throw "expected exactly one $n, found $($found.Count)" }
            $dest = Join-Path (Resolve-Path signed) $n
            Copy-Item $found[0].FullName $dest
            if ((Get-FileHash $dest -Algorithm SHA256).Hash -ne $expect[$n]) { throw "sha256 differs from the build job for $n" }
            & $env:JAVA_EXE -jar (Join-Path $dir 'jsign.jar') --replace --storetype PKCS11 --keystore (Join-Path $dir 'pkcs11.cfg') `
              --storepass none --alias RoeLite-27 --certfile (Join-Path $dir 'chain.pem') --alg SHA-256 `
              --tsaurl http://timestamp.globalsign.com/tsa/r6advanced1 --tsmode RFC3161 --tsretries 5 --tsretrywait 10 $dest
            if ($LASTEXITCODE -ne 0) { throw "jsign failed for $n" }
          }

      - name: Verify Authenticode signatures
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          foreach ($f in Get-ChildItem signed -File) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0,-10} {1} | {2}" -f $s.Status, $f.Name, $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'Roelof Solutions Pty Ltd' -or -not $s.TimeStamperCertificate) { $bad++ }
          }
          if (@(Get-ChildItem signed -File).Count -ne 3) { $bad++ }
          if ($bad) { throw "$bad file(s) not validly signed and timestamped" }

      - name: Upload signed Windows exes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-win
          path: signed/*
          if-no-files-found: error

      # The persistent runner keeps nothing: credentials file, tool dir and workspace are removed
      # even when an earlier step failed.
      - name: Remove credentials and workspace
        if: always()
        run: |
          if ($env:GOOGLE_APPLICATION_CREDENTIALS) { Remove-Item -Force -ErrorAction SilentlyContinue $env:GOOGLE_APPLICATION_CREDENTIALS }
          if ($env:TOOLS) { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $env:TOOLS }
          Get-ChildItem -Force -ErrorAction SilentlyContinue $env:GITHUB_WORKSPACE | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

  # ---------------------------------------------------------------------------
  # 3. Collect every platform's asset and cut ONE Release. It is created as a
  #    DRAFT first and only flipped live once every asset has attached, so a
  #    flaky upload never leaves a live "latest" release missing RoeSnip.exe (the
  #    self-updater would find no asset). The .gz siblings are made here from the
  #    SIGNED bytes. Self-updaters trust the GitHub asset digest of each file.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [prep, build-xplat, sign-windows]
    runs-on: ubuntu-latest
    # contents: write only; no OIDC rights, and no third-party actions (gh CLI only).
    permissions:
      contents: write
    steps:
      - name: Download cross-platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: xplat-*
          path: dist

      - name: No Windows binaries from the cross-platform builds
        # Only the signed-win artifact may carry exes; anything else would ship unsigned.
        run: |
          if find dist -iname '*.exe*' -o -iname '*.dll' | grep -q .; then
            echo "::error::cross-platform artifacts contain Windows binaries"; exit 1
          fi

      - name: Download signed Windows exes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-win
          path: dist-win

      - name: Stage Windows exes and gzip siblings
        run: |
          set -euo pipefail
          # Names spelled out: CrossPlatformInstallTests checks every update asset appears here literally.
          gz() {
            [ -f "dist-win/$1" ] || { echo "::error::missing signed $1"; exit 1; }
            gzip -9 -n -c "dist-win/$1" > "dist-win/$2"
          }
          gz RoeSnip.exe RoeSnip.exe.gz
          gz RoeSnipApp-win-x64.exe RoeSnipApp-win-x64.exe.gz
          gz RoeSnipApp-win-arm64.exe RoeSnipApp-win-arm64.exe.gz
          find dist dist-win -type f -printf '%p  (%s bytes)\n'

      # A leftover draft of this tag (failed or abandoned run) is replaced.
      - name: Remove a stale draft of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done

      - name: Create draft release and attach every asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prep.outputs.tag }}
          SHA: ${{ needs.prep.outputs.sha }}
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find dist dist-win -type f -print0)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no assets to upload"; exit 1; }
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --draft --target "$SHA" --title "RoeSnip $VERSION" --notes ""

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prep.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
